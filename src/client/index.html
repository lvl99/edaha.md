<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article editor | edaha.md</title>
    <script>
      // Show the theme chosen with the theme switcher (see src/client/theme) before the page appears
      try {
        const theme = localStorage.getItem("edaha-editor-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <edaha-editor></edaha-editor>
  </body>
</html>
